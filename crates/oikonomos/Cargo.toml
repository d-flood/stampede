[package]
name = "oikonomos"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net"] }
