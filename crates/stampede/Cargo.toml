[package]
name = "stampede"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
clap = { version = "4.6.9", features = ["derive"] }
flate2 = "1.1.11"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
grep-matcher = "0.1.10"
grep-regex = "0.1.15"
grep-searcher = "0.1.18"
github-copilot-sdk = { version = "1.0.35", default-features = false }
ignore = "0.4.35"
inotify = { version = "0.11.5", default-features = false }
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs", rev = "483ea3d5247b214060da58ef6037a95f30ae89fb" }
lol_html = "3.0.3"
mime_guess = "2.0.5"
nix = { version = "0.32.0", features = ["process", "signal", "fs"] }
notify = "9.0.0"
portable-pty = "0.9.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
shlex = "2.0.1"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "io-util", "time", "fs"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.20", features = ["codec"] }
tower-http = { version = "0.7.1", features = ["compression-gzip"] }
toml = "1.2.2"
ttf-parser = "0.25.1"
uuid = { version = "1.29.3", features = ["v4"] }
web-push-native = "0.5.0"

[[test]]
name = "integration"
path = "tests/integration.rs"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["time"] }
